    let cameraData = [];
    let filteredData = [];

    // Initial Map Center (Kaohsiung City Center)
    const KAOHSIUNG_CENTER = [22.6397, 120.3021];
    const INITIAL_ZOOM = 13;

    // Initialize Leaflet Map
    const map = L.map('map', { zoomControl: false }).setView(KAOHSIUNG_CENTER, INITIAL_ZOOM);
    
    // Add Custom Zoom Control on Bottom Right
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Use CARTO Voyager Tile Layer (Open, Stable, No 403 Blocking)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      subdomains: 'abcd',
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/attributions">CARTO</a>'
    }).addTo(map);

    const markersGroup = L.layerGroup().addTo(map);

    // Custom Marker Generator
    function createCameraMarkerIcon(item, isSelected = false) {
      const isTech = item.item.includes('科技執法');
      const isRedLight = item.item.includes('闖紅燈');
      
      let badgeBg = 'bg-rose-600';
      let iconClass = 'fa-camera-retro';

      if (isTech) {
        badgeBg = 'bg-purple-600';
        iconClass = 'fa-microchip';
      } else if (isRedLight && !item.item.includes('超速')) {
        badgeBg = 'bg-amber-600';
        iconClass = 'fa-traffic-light';
      }

      const selectedStyle = isSelected ? 'ring-4 ring-blue-500 ring-offset-2 scale-125 z-[600]' : '';

      return L.divIcon({
        className: 'custom-camera-marker',
        html: `
          <div class="pulse-camera ${badgeBg} ${selectedStyle} text-white font-bold text-xs w-9 h-9 rounded-full flex flex-col items-center justify-center shadow-xl border-2 border-white transition-all duration-200">
            <i class="fa-solid ${iconClass} text-xs"></i>
            <span class="text-[9px] font-mono leading-none mt-0.5">${item.speedLimit || '50'}</span>
          </div>
        `,
        iconSize: [36, 36],
        iconAnchor: [18, 18],
        popupAnchor: [0, -18]
      });
    }

    // Parse CSV data safely
    function parseCSVData(csvText) {
      Papa.parse(csvText, {
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          cleanAndLoadData(results.data);
        },
        error: function(err) {
          showToast("CSV 解析失敗，請確認檔案格式", true);
        }
      });
    }

    // Clean and validate data with defensive logic
    function cleanAndLoadData(rawData) {
      cameraData = rawData.map((row, index) => {
        // Find field matching keys regardless of minor spacing
        const getVal = (possibleKeys) => {
          for (let key of possibleKeys) {
            for (let rowKey in row) {
              if (rowKey.trim() === key) return row[rowKey] ? row[rowKey].trim() : '';
            }
          }
          return '';
        };

        const id = getVal(['項次', '編號', 'ID']) || (index + 1).toString();
        const district = getVal(['行政區', 'District']) || '其他區';
        const location = getVal(['設置地點', '路段', '位置', 'Location']);
        const direction = getVal(['測照方向', '方向', 'Direction']) || '未標示';
        const speedLimit = getVal(['限速', '速限', 'Speed']) || '50';
        const item = getVal(['取締項目', '取締類別', 'Item']) || '測速';
        const latStr = getVal(['座標緯(N)度', '緯度', 'Latitude', 'lat', 'LAT']);
        const lngStr = getVal(['座標經(E)度', '經度', 'Longitude', 'lng', 'LNG', 'lon']);
        const notes = getVal(['備註', 'Notes']) || '';

        const lat = parseFloat(latStr);
        const lng = parseFloat(lngStr);

        if (!location || isNaN(lat) || isNaN(lng)) return null;

        return {
          id: id.toString(),
          district,
          location,
          direction,
          speedLimit,
          item,
          lat,
          lng,
          notes
        };
      }).filter(Boolean);

      document.getElementById('api-status-text').innerText = "已加載高雄市警局違規照相/科技執法地點";
      initFiltersAndRender();
      showToast(`成功讀取 ${cameraData.length} 筆經緯度照相點`);
    }

    // Populate Dropdown Filters
    function initFiltersAndRender() {
      const districtSelect = document.getElementById('district-filter');
      const itemSelect = document.getElementById('item-filter');

      const districts = [...new Set(cameraData.map(d => d.district))].sort();
      const items = [...new Set(cameraData.map(d => d.item))].sort();

      districtSelect.innerHTML = '<option value="">全部行政區</option>';
      districts.forEach(d => {
        const count = cameraData.filter(c => c.district === d).length;
        districtSelect.innerHTML += `<option value="${d}">${d} (${count})</option>`;
      });

      itemSelect.innerHTML = '<option value="">全部類型</option>';
      items.forEach(i => {
        itemSelect.innerHTML += `<option value="${i}">${i}</option>`;
      });

      applyFilters();
    }

    // Apply filters based on search and selection
    function applyFilters() {
      const searchText = document.getElementById('search-input').value.trim().toLowerCase();
      const selectedDistrict = document.getElementById('district-filter').value;
      const selectedItem = document.getElementById('item-filter').value;

      document.getElementById('search-clear').classList.toggle('hidden', searchText === '');

      filteredData = cameraData.filter(item => {
        const matchSearch = item.location.toLowerCase().includes(searchText) || 
                            item.district.toLowerCase().includes(searchText) ||
                            item.direction.toLowerCase().includes(searchText);
        const matchDistrict = !selectedDistrict || item.district === selectedDistrict;
        const matchItem = !selectedItem || item.item === selectedItem;

        return matchSearch && matchDistrict && matchItem;
      });

      renderSidebarList(filteredData);
      renderMapMarkers(filteredData);
    }

    // Render list items in sidebar
    function renderSidebarList(items) {
      const listEl = document.getElementById('data-list');
      document.getElementById('visible-count').innerText = items.length;
      document.getElementById('total-count').innerText = cameraData.length;
      document.getElementById('data-counter').innerText = `${cameraData.length} 筆`;

      if (items.length === 0) {
        listEl.innerHTML = `
          <div class="p-8 text-center text-slate-400">
            <i class="fa-solid fa-camera-slash text-3xl mb-2 text-slate-300"></i>
            <p class="text-sm">查無符合條件的照相點資料</p>
          </div>`;
        return;
      }

      listEl.innerHTML = items.map(item => {
        const isSelected = item.id === selectedItemId;
        const isTech = item.item.includes('科技執法');
        const badgeClass = isTech ? 'bg-purple-100 text-purple-800 border-purple-200' : 'bg-rose-100 text-rose-800 border-rose-200';

        return `
          <div onclick="handleCardClick('${item.id}')" 
               class="p-3.5 transition-all cursor-pointer hover:bg-slate-50 border-l-4 ${isSelected ? 'bg-rose-50/80 border-rose-600 shadow-sm' : 'border-transparent'}">
            <div class="flex items-center justify-between gap-2 mb-1.5">
              <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-slate-100 text-slate-700 border border-slate-200">${item.district}</span>
              <div class="flex items-center gap-1.5">
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full border ${badgeClass}">${item.item}</span>
                <span class="text-[10px] font-mono font-bold px-1.5 py-0.5 bg-slate-800 text-white rounded">限速 ${item.speedLimit}</span>
              </div>
            </div>
            
            <h3 class="font-bold text-slate-800 text-sm mb-1 line-clamp-2 leading-snug">${item.location}</h3>
            
            <p class="text-xs text-slate-500 mb-2"><i class="fa-solid fa-compass text-slate-400 mr-1"></i>方向：${item.direction}</p>

            <div class="flex items-center justify-between text-[10px] text-slate-400 border-t border-slate-100 pt-1.5 font-mono">
              <span><i class="fa-solid fa-location-dot text-rose-600 mr-0.5"></i> ${item.lat.toFixed(4)}, ${item.lng.toFixed(4)}</span>
              <span class="text-rose-600 font-medium flex items-center gap-0.5">
                地圖定位 <i class="fa-solid fa-chevron-right text-[8px]"></i>
              </span>
            </div>
          </div>
        `;
      }).join('');
    }

    // Render markers on Leaflet map
    function renderMapMarkers(items) {
      markersGroup.clearLayers();
      leafletMarkers = {};

      items.forEach(item => {
        const marker = L.marker([item.lat, item.lng], {
          icon: createCameraMarkerIcon(item, item.id === selectedItemId)
        });

        const popupContent = `
          <div class="p-1 min-w-[220px]">
            <div class="flex items-center justify-between gap-2 mb-1.5">
              <span class="bg-slate-900 text-white text-[10px] px-2 py-0.5 rounded font-bold">${item.district}</span>
              <span class="bg-rose-600 text-white text-[10px] px-2 py-0.5 rounded font-bold">限速 ${item.speedLimit} km/h</span>
            </div>
            <h4 class="font-bold text-sm text-slate-900 mb-1 leading-snug">${item.location}</h4>
            <div class="text-xs text-slate-600 space-y-1 my-2 bg-slate-50 p-2 rounded-lg border border-slate-200">
              <div><strong class="text-slate-700">取締項目：</strong> ${item.item}</div>
              <div><strong class="text-slate-700">測照方向：</strong> ${item.direction}</div>
              ${item.notes ? `<div><strong class="text-slate-700">備註：</strong> ${item.notes}</div>` : ''}
            </div>
            <div class="text-[10px] text-slate-400 font-mono border-t pt-1 flex items-center justify-between">
              <span>📍 精確座標</span>
              <span>${item.lat.toFixed(5)}, ${item.lng.toFixed(5)}</span>
            </div>
          </div>
        `;

        marker.bindPopup(popupContent);

        marker.on('click', () => {
          selectedItemId = item.id;
          renderSidebarList(filteredData);
        });

        marker.addTo(markersGroup);
        leafletMarkers[item.id] = marker;
      });

      if (items.length > 0 && !selectedItemId) {
        const group = new L.featureGroup(Object.values(leafletMarkers));
        map.fitBounds(group.getBounds().pad(0.1));
      }
    }

    // Handle list item click
    function handleCardClick(id) {
      const item = cameraData.find(i => i.id === id);
      if (!item) return;

      selectedItemId = id;
      renderSidebarList(filteredData);

      if (window.innerWidth < 768) {
        switchToMapTab();
      }

      map.flyTo([item.lat, item.lng], 16, { duration: 1.2 });

      if (leafletMarkers[id]) {
        leafletMarkers[id].openPopup();
      }
    }

    // Bind Event Listeners
    function bindEvents() {
      document.getElementById('search-input').addEventListener('input', applyFilters);
      document.getElementById('district-filter').addEventListener('change', applyFilters);
      document.getElementById('item-filter').addEventListener('change', applyFilters);

      document.getElementById('search-clear').addEventListener('click', () => {
        document.getElementById('search-input').value = '';
        applyFilters();
      });

      document.getElementById('btn-reset-filters').addEventListener('click', () => {
        document.getElementById('search-input').value = '';
        document.getElementById('district-filter').value = '';
        document.getElementById('item-filter').value = '';
        selectedItemId = null;
        applyFilters();
        map.flyTo(KAOHSIUNG_CENTER, INITIAL_ZOOM);
      });

      document.getElementById('btn-reset-map').addEventListener('click', () => {
        selectedItemId = null;
        applyFilters();
        map.flyTo(KAOHSIUNG_CENTER, INITIAL_ZOOM);
      });

      // CSV File Upload Listener
      document.getElementById('csv-file-input').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(evt) {
          parseCSVData(evt.target.result);
        };
        reader.readAsText(file);
      });

      // Mobile Tab Controls
      document.getElementById('tab-list').addEventListener('click', () => {
        document.getElementById('sidebar-panel').classList.remove('hidden');
        document.getElementById('map-panel').classList.add('hidden');
        document.getElementById('tab-list').className = 'flex-1 py-1.5 text-xs font-semibold rounded-md bg-white shadow text-slate-800 flex items-center justify-center gap-1';
        document.getElementById('tab-map').className = 'flex-1 py-1.5 text-xs font-semibold rounded-md text-slate-600 flex items-center justify-center gap-1';
      });

      document.getElementById('tab-map').addEventListener('click', switchToMapTab);

      // Stats Modal Triggers
      document.getElementById('btn-stats').addEventListener('click', showStatsModal);
      document.getElementById('btn-close-stats').addEventListener('click', () => {
        document.getElementById('modal-stats').classList.add('hidden');
      });
    }

    function switchToMapTab() {
      document.getElementById('sidebar-panel').classList.add('hidden');
      document.getElementById('map-panel').classList.remove('hidden');
      document.getElementById('map-panel').classList.add('block');
      document.getElementById('tab-map').className = 'flex-1 py-1.5 text-xs font-semibold rounded-md bg-white shadow text-slate-800 flex items-center justify-center gap-1';
      document.getElementById('tab-list').className = 'flex-1 py-1.5 text-xs font-semibold rounded-md text-slate-600 flex items-center justify-center gap-1';
      setTimeout(() => map.invalidateSize(), 200);
    }

    // Generate Stats Modal Data
    function showStatsModal() {
      const counts = {};
      cameraData.forEach(item => {
        counts[item.district] = (counts[item.district] || 0) + 1;
      });

      const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
      const max = sorted[0] ? sorted[0][1] : 1;

      const container = document.getElementById('stats-content');
      container.innerHTML = `
        <div class="text-xs text-slate-500 mb-2">全高雄市共設有 <strong class="text-rose-600 font-bold">${cameraData.length}</strong> 處固定執法照相點：</div>
      ` + sorted.map(([district, count]) => {
        const percentage = Math.round((count / max) * 100);
        return `
          <div>
            <div class="flex justify-between text-xs font-semibold mb-1 text-slate-700">
              <span>${district}</span>
              <span class="text-rose-600 font-mono">${count} 處</span>
            </div>
            <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
              <div class="bg-rose-500 h-2.5 rounded-full transition-all duration-500" style="width: ${percentage}%"></div>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('modal-stats').classList.remove('hidden');
    }

    // Toast Notification helper
    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = msg;
      toast.classList.remove('translate-y-[-100px]', 'opacity-0', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('translate-y-[-100px]', 'opacity-0', 'pointer-events-none');
      }, 3000);
    }

    // Window Load Entry Point
    window.onload = function() {
      bindEvents();
      parseCSVData(EMBEDDED_CSV_STRING);
    };
  </script>
</body>
</html>
