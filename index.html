        html: `
          <div class="${isActive ? 'pulse-marker' : ''} bg-white p-1.5 rounded-full shadow-lg border-2 border-slate-700 flex items-center justify-center" style="width: 32px; height: 32px;">
            <i class="fa-solid fa-camera text-sm" style="color: ${colorClass};"></i>
          </div>
        `,
        iconSize: [32, 32],
        iconAnchor: [16, 16],
        popupAnchor: [0, -16]
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      fetch('529f579b-72ef-4aa4-a050-922e0b5aa25f.csv')
        .then(res => {
          if(!res.ok) throw new Error('File not found');
          return res.text();
        })
        .then(csvText => parseAndLoadCSV(csvText))
        .catch(err => {
          console.log('Using pre-loaded Kaohsiung dataset.');
          initData(DEFAULT_DATA);
        });

      bindEvents();
    });

    function parseAndLoadCSV(csvString) {
      Papa.parse(csvString, {
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          const parsed = results.data
            .filter(row => {
              const idNum = parseInt(row['編號']);
              return !isNaN(idNum) && row['路段'] && row['行政區'];
            })
            .map(row => ({
              id: parseInt(row['編號']),
              district: String(row['行政區']).trim(),
              road: String(row['路段']).trim(),
              direction: row['測照方向'] ? String(row['測照方向']).trim() : '未標示',
              item: row['取締項目'] ? String(row['取締項目']).trim() : '超速'
            }));

          if(parsed.length > 0) {
            initData(parsed);
          } else {
            initData(DEFAULT_DATA);
          }
        }
      });
    }

    function initData(data) {
      cameraData = data;
      filteredData = [...cameraData];
      
      document.getElementById('total-count').innerText = cameraData.length;
      document.getElementById('count-num').innerText = cameraData.length;

      populateFilterDropdowns();
      applyFilters();
    }

    function populateFilterDropdowns() {
      const districtSelect = document.getElementById('district-filter');
      const itemSelect = document.getElementById('item-filter');

      const districts = [...new Set(cameraData.map(d => d.district))].sort();
      const items = [...new Set(cameraData.map(d => d.item))].sort();

      districtSelect.innerHTML = '<option value="">全部行政區</option>';
      districts.forEach(d => {
        const count = cameraData.filter(c => c.district === d).length;
        districtSelect.innerHTML += `<option value="${d}">${d} (${count})</option>`;
      });

      itemSelect.innerHTML = '<option value="">全部取締種類</option>';
      items.forEach(i => {
        itemSelect.innerHTML += `<option value="${i}">${i}</option>`;
      });
    }

    function renderList(items) {
      const listEl = document.getElementById('camera-list');
      document.getElementById('visible-count').innerText = items.length;

      if (items.length === 0) {
        listEl.innerHTML = `
          <div class="p-8 text-center text-slate-400">
            <i class="fa-solid fa-camera-slash text-3xl mb-2 text-slate-300"></i>
            <p class="text-sm">查無符合條件的測速照相點</p>
          </div>`;
        return;
      }

      listEl.innerHTML = items.map(item => {
        const isSelected = item.id === selectedCameraId;
        return `
          <div onclick="handleCardClick(${item.id})" 
               class="p-3.5 transition-all cursor-pointer hover:bg-slate-50 border-l-4 ${isSelected ? 'bg-blue-50/80 border-blue-600 shadow-sm' : 'border-transparent'}">
            <div class="flex items-center justify-between gap-2 mb-1">
              <div class="flex items-center gap-1.5">
                <span class="text-[11px] font-mono font-bold text-slate-500 bg-slate-100 px-1.5 py-0.5 rounded border border-slate-200">#${item.id}</span>
                <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-blue-100 text-blue-700">${item.district}</span>
              </div>
              <span class="text-xs font-medium px-2 py-0.5 rounded-full ${item.item === '超速' ? 'bg-red-100 text-red-700' : 'bg-amber-100 text-amber-700'}">
                ${item.item}
              </span>
            </div>
            
            <h3 class="font-bold text-slate-800 text-sm mb-1 line-clamp-1">${item.road}</h3>
            
            <div class="flex items-center justify-between text-xs text-slate-500">
              <span class="flex items-center gap-1">
                <i class="fa-solid fa-compass text-slate-400"></i> 方向：${item.direction}
              </span>
              <span class="text-blue-600 font-medium text-[11px] flex items-center gap-0.5">
                地圖定位 <i class="fa-solid fa-chevron-right text-[9px]"></i>
              </span>
            </div>
          </div>
        `;
      }).join('');
    }

    function applyFilters() {
      const searchText = document.getElementById('search-input').value.trim().toLowerCase();
      const selectedDistrict = document.getElementById('district-filter').value;
      const selectedItem = document.getElementById('item-filter').value;

      document.getElementById('search-clear').classList.toggle('hidden', searchText === '');

      filteredData = cameraData.filter(item => {
        const matchSearch = item.road.toLowerCase().includes(searchText) || item.district.toLowerCase().includes(searchText);
        const matchDistrict = !selectedDistrict || item.district === selectedDistrict;
        return matchSearch && matchDistrict && (!selectedItem || item.item === selectedItem);
      });

      renderList(filteredData);
    }

    async function handleCardClick(id) {
      const item = cameraData.find(c => c.id === id);
      if (!item) return;

      selectedCameraId = id;
      renderList(filteredData);

      if (window.innerWidth < 768) {
        switchToMapTab();
      }

      await locateAndHighlightOnMap(item);
    }

    async function locateAndHighlightOnMap(item) {
      markersGroup.clearLayers();

      const queryRoad = item.road.startsWith('高雄市') ? item.road : `高雄市${item.road}`;
      let coords = geocodeCache[queryRoad];

      if (!coords) {
        try {
          const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(queryRoad)}&limit=1`);
          const results = await response.json();

          if (results && results.length > 0) {
            coords = [parseFloat(results[0].lat), parseFloat(results[0].lon)];
            geocodeCache[queryRoad] = coords;
          } else {
            coords = await fetchDistrictCoords(item.district);
          }
        } catch (e) {
          coords = await fetchDistrictCoords(item.district);
        }
      }

      if (coords) {
        map.flyTo(coords, 15, { duration: 1.2 });

        const marker = L.marker(coords, { icon: createCustomIcon(true) }).addTo(markersGroup);

        marker.bindPopup(`
          <div class="p-2 min-w-[200px]">
            <div class="flex items-center gap-1.5 mb-1">
              <span class="bg-red-500 text-white text-[10px] px-1.5 py-0.5 rounded font-mono">NO.${item.id}</span>
              <span class="text-xs font-bold text-slate-800">${item.district}</span>
            </div>
            <h4 class="font-bold text-sm text-slate-900 mb-1">${item.road}</h4>
            <p class="text-xs text-slate-600 mb-0.5"><i class="fa-solid fa-arrows-left-right text-slate-400"></i> 測照方向：${item.direction}</p>
            <p class="text-xs text-slate-600 mb-2"><i class="fa-solid fa-shield-halved text-slate-400"></i> 取締項目：${item.item}</p>
            <div class="border-t pt-1.5 text-[10px] text-slate-400">
              📍 標記位置為 OpenStreetMap 檢索點
            </div>
          </div>
        `).openPopup();
      }
    }

    async function fetchDistrictCoords(district) {
      const key = `高雄市${district}`;
      if (geocodeCache[key]) return geocodeCache[key];

      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(key)}&limit=1`);
        const data = await res.json();
        if (data && data.length > 0) {
          const coords = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
          geocodeCache[key] = coords;
          return coords;
        }
      } catch (e) {}
      return defaultCenter;
    }

    function bindEvents() {
      document.getElementById('search-input').addEventListener('input', applyFilters);
      document.getElementById('district-filter').addEventListener('change', applyFilters);
      document.getElementById('item-filter').addEventListener('change', applyFilters);

      document.getElementById('search-clear').addEventListener('click', () => {
        document.getElementById('search-input').value = '';
        applyFilters();
      });

      document.getElementById('btn-reset-filters').addEventListener('click', () => {
        document.getElementById('search-input').value = '';
        document.getElementById('district-filter').value = '';
        document.getElementById('item-filter').value = '';
        selectedCameraId = null;
        applyFilters();
      });

      document.getElementById('csv-file-input').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function(evt) {
            parseAndLoadCSV(evt.target.result);
          };
          reader.readAsText(file, 'UTF-8');
        }
      });

      document.getElementById('tab-list').addEventListener('click', () => {
        document.getElementById('sidebar-panel').classList.remove('hidden');
        document.getElementById('map-panel').classList.add('hidden');
        document.getElementById('tab-list').className = 'flex-1 py-1.5 text-xs font-semibold rounded-md bg-white shadow text-slate-800 flex items-center justify-center gap-1';
        document.getElementById('tab-map').className = 'flex-1 py-1.5 text-xs font-semibold rounded-md text-slate-600 flex items-center justify-center gap-1';
      });

      document.getElementById('tab-map').addEventListener('click', switchToMapTab);

      document.getElementById('btn-stats').addEventListener('click', showStatsModal);
      document.getElementById('btn-close-stats').addEventListener('click', () => {
        document.getElementById('modal-stats').classList.add('hidden');
      });
    }

    function switchToMapTab() {
      document.getElementById('sidebar-panel').classList.add('hidden');
      document.getElementById('map-panel').classList.remove('hidden');
      document.getElementById('map-panel').classList.add('block');
      document.getElementById('tab-map').className = 'flex-1 py-1.5 text-xs font-semibold rounded-md bg-white shadow text-slate-800 flex items-center justify-center gap-1';
      document.getElementById('tab-list').className = 'flex-1 py-1.5 text-xs font-semibold rounded-md text-slate-600 flex items-center justify-center gap-1';
      setTimeout(() => map.invalidateSize(), 200);
    }

    function showStatsModal() {
      const counts = {};
      cameraData.forEach(c => {
        counts[c.district] = (counts[c.district] || 0) + 1;
      });

      const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
      const max = sorted[0] ? sorted[0][1] : 1;

      const container = document.getElementById('stats-content');
      container.innerHTML = sorted.map(([district, count]) => {
        const percentage = Math.round((count / max) * 100);
        return `
          <div>
            <div class="flex justify-between text-xs font-semibold mb-1 text-slate-700">
              <span>${district}</span>
              <span class="text-blue-600">${count} 處</span>
            </div>
            <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
              <div class="bg-blue-600 h-2.5 rounded-full transition-all duration-500" style="width: ${percentage}%"></div>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('modal-stats').classList.remove('hidden');
    }
  </script>
</body>
</html>
